services:
  - type: web
    name: keepup
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/keepup.db
      # - key: APP_PASSWORD
      #   value: your_password_here
    disk:
      name: keepup-data
      mountPath: /var/data
      sizeGB: 1
